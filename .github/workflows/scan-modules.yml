name: Scan module datasheets

on:
  schedule:
    - cron: "43 5 * * 1" # weekly, Monday 05:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Parser self-test
        run: node scripts/scan-modules.mjs --parse-test
      - name: Scan sources
        run: node scripts/scan-modules.mjs
        env:
          SCAN_DEBUG_DIR: scan-debug
      - name: Extrahierte Texte ins Log (Parser-Tuning)
        if: always()
        run: |
          for f in scan-debug/*Datenblatt*.txt scan-debug/*data*sheet*.txt; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            grep -inE 'leistung|spannung|strom|voltage|current|power|voc|isc|imp|vmp|pmax|koeffizient|coefficient|temperatur|stc|noct' "$f" | head -80
            echo "::endgroup::"
          done
          for f in scan-debug/*__index.html scan-debug/*__page1.html; do
            [ -e "$f" ] || continue
            echo "::group::links in $f"
            grep -oiE '(href|src|data-[a-z-]+)="[^"]*(\.pdf|\?a=|produkt|datenblatt|download)[^"]*"' "$f" | sort -u | head -40
            echo "::endgroup::"
          done
      - name: Upload extracted texts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-debug
          path: scan-debug/
          retention-days: 3
          if-no-files-found: ignore
      - name: Open pull request with proposals
        uses: peter-evans/create-pull-request@v6
        with:
          branch: scan/module-proposals
          title: "Modul-Scan: neue Datenblatt-Extraktionen"
          commit-message: "feat(data): automatisch extrahierte Module aus Datenblatt-Scan"
          body-path: scan-report.md
          add-paths: public/data/modules_manual.json
          delete-branch: true
