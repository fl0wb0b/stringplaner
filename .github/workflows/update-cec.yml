name: Update CEC module data

on:
  schedule:
    - cron: "17 4 3 * *" # monthly, 3rd day 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-cec.mjs
      - name: Commit and push if changed
        run: |
          if git diff --quiet public/data/modules.json; then
            echo "No changes in CEC data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/modules.json
          git commit -m "chore: update CEC module data"
          git push
